<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오즈키즈 슈즈 작업지시서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* ── TOKENS ── */
:root,[data-theme="dark"]{
  --bg:#0E0E10;--surface:#18181C;--card:#1F1F25;--card-hover:#26262E;
  --border:rgba(255,255,255,0.07);--border-md:rgba(255,255,255,0.13);--border-hi:rgba(255,255,255,0.22);
  --txt:#F0EFF4;--txt-2:#9A99A8;--txt-3:#5C5B6B;
  --accent:#EC4899;--accent-dim:#3D1B2E;
  --green:#34D399;--green-dim:#0D2F22;
  --amber:#FBBF24;--amber-dim:#2D2208;
  --red:#F87171;--red-dim:#2D1010;
  --blue:#60A5FA;--blue-dim:#0D1F3A;
  --cost-bg:#0A0A0C;--mtx-head:rgba(255,255,255,0.04);--rem-bg:rgba(251,191,36,0.04);
}
[data-theme="light"]{
  --bg:#FFF8FA;--surface:#FFFFFF;--card:#FFFFFF;--card-hover:#FFF5F8;
  --border:rgba(0,0,0,0.08);--border-md:rgba(0,0,0,0.14);--border-hi:rgba(0,0,0,0.24);
  --txt:#111110;--txt-2:#5A5956;--txt-3:#9A9895;
  --accent:#DB2777;--accent-dim:#FCE7F3;
  --green:#15803D;--green-dim:#F0FDF4;
  --amber:#B45309;--amber-dim:#FFFBEB;
  --red:#DC2626;--red-dim:#FEF2F2;
  --blue:#1D4ED8;--blue-dim:#EFF6FF;
  --cost-bg:#F3F2EF;--mtx-head:rgba(0,0,0,0.04);--rem-bg:rgba(180,83,9,0.04);
}

/* light pill overrides */
[data-theme="light"] .s계속판매{background:#F0FDF4;color:#15803D;border-color:rgba(21,128,61,.2)}
[data-theme="light"] .s생산중{background:#FCE7F3;color:#DB2777;border-color:rgba(219,39,119,.2)}
[data-theme="light"] .s생산요청{background:#FFFBEB;color:#B45309;border-color:rgba(180,83,9,.2)}
[data-theme="light"] .s대기{background:#F3F2EF;color:#9A9895;border-color:rgba(0,0,0,.1)}
[data-theme="light"] .s완료{background:#F5F3FF;color:#6D28D9;border-color:rgba(109,40,217,.2)}
[data-theme="light"] .s진행취소{background:#FEF2F2;color:#DC2626;border-color:rgba(220,38,38,.2)}
[data-theme="light"] .chip.on{background:#FCE7F3;border-color:#DB2777;color:#9F1239}
[data-theme="light"] .chip.on.sp{background:#FDF4FF;border-color:#D946EF;color:#86198F}
[data-theme="light"] .chip.on.su{background:#F0FDF4;border-color:#22C55E;color:#166534}
[data-theme="light"] .chip.on.fa{background:#FFFBEB;border-color:#F59E0B;color:#92400E}
[data-theme="light"] .chip.on.wi{background:#EFF6FF;border-color:#3B82F6;color:#1E40AF}
[data-theme="light"] .tag{background:rgba(0,0,0,.04);color:var(--txt-2);border-color:var(--border)}
[data-theme="light"] .cdot{border-color:rgba(0,0,0,.15)}
[data-theme="light"] .mtx tr:hover td{background:rgba(0,0,0,.02)}
[data-theme="light"] .mtx td.tot,[data-theme="light"] .mtx tr.tr td{color:var(--accent)}
[data-theme="light"] .mtx tr.tr{background:rgba(219,39,119,.05)}
[data-theme="light"] .cost-retail{color:var(--green)}
[data-theme="light"] .wo-head{background:linear-gradient(135deg,rgba(219,39,119,.05) 0%,transparent 60%)}
[data-theme="light"] .img-expand{background:rgba(0,0,0,.35)}
[data-theme="light"] .wo-btn:hover{background:#FCE7F3;border-color:#DB2777;color:#9F1239}
[data-theme="light"] .logo-mark{background:var(--accent)}
[data-theme="light"] .fgroup-head:hover{background:rgba(0,0,0,.03)}
[data-theme="light"] .pcard-img-placeholder svg,[data-theme="light"] .img-placeholder-lg svg{stroke:var(--txt-3)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

/* Layout */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:216px;min-width:216px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:background .2s,border-color .2s}
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* Sidebar top — 의류 사이트와 동일한 분위기 */
.sb-top{padding:0;border-bottom:1px solid var(--border)}
.sb-brand{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 10px 16px}
.sb-brand-mark{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FB7185,#EC4899);display:grid;place-items:center;box-shadow:0 6px 18px rgba(236,72,153,.28)}
.sb-brand-mark svg{width:24px;height:24px}
.sb-brand-name{font-size:17px;font-weight:800;color:var(--txt);letter-spacing:-.03em;line-height:1}
.sb-brand-sub{font-size:10px;color:var(--txt-3);letter-spacing:.02em}

/* CATEGORY 섹션 — 전체/의류/슈즈 카드 */
.sb-category{padding:14px 12px 16px;border-bottom:1px solid var(--border)}
.sb-section-label{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--txt-3);margin-bottom:10px;padding:0 2px}
.sb-cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sb-cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s cubic-bezier(.4,0,.2,1);font-family:inherit}
.sb-cat-btn:hover{border-color:rgba(236,72,153,.3);transform:translateY(-1px);box-shadow:0 4px 12px rgba(236,72,153,.1)}
.sb-cat-btn.active{background:linear-gradient(135deg,#FB7185,#EC4899);border-color:transparent;box-shadow:0 6px 18px rgba(236,72,153,.32);transform:translateY(-1px)}
.sb-cat-icon{font-size:24px;line-height:1}
.sb-cat-name{font-size:11px;font-weight:700;color:var(--txt-2);letter-spacing:.02em}
.sb-cat-btn.active .sb-cat-name{color:white}

/* 노션 + 새로고침 + 테마 — CATEGORY 아래 */
.sb-tools{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--border)}
.notion-tag{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--txt-3);flex:1;min-width:0}
.notion-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Theme toggle */
.theme-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:var(--txt-3);transition:.15s}
.theme-btn:hover{border-color:var(--border-md);color:var(--txt)}
.theme-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.icon-moon{display:block}
.icon-sun{display:none}
[data-theme="light"] .icon-moon{display:none}
[data-theme="light"] .icon-sun{display:block}

/* Search */
.sb-search{padding:9px 11px;border-bottom:1px solid var(--border)}
.s-wrap{position:relative}
.s-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--txt-3);fill:none;stroke-width:2}
.s-wrap input{width:100%;padding:7px 9px 7px 28px;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--txt);outline:none;transition:.15s}
.s-wrap input::placeholder{color:var(--txt-3)}
.s-wrap input:focus{border-color:var(--accent)}

/* ── ACCORDION FILTERS ── */
.sb-filters{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.fg{border-bottom:1px solid var(--border)}
.fg-head{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;cursor:pointer;user-select:none;transition:.12s}
.fg-head:hover{background:var(--card-hover)}
.fg-lbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--txt-2)}
.fg-ico{width:13px;height:13px;stroke:var(--txt-3);fill:none;stroke-width:2;flex-shrink:0}
.fg-badge{font-size:10px;background:var(--accent-dim);color:var(--accent);border-radius:999px;padding:1px 7px;font-weight:600;display:none}
.fg-badge.show{display:inline}
.fg-arr{width:13px;height:13px;stroke:var(--txt-3);fill:none;stroke-width:2;transition:transform .2s;flex-shrink:0}
.fg.open .fg-arr{transform:rotate(180deg)}
.fg-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.fg.open .fg-body{max-height:220px}
.fg-inner{padding:0 11px 11px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 9px;border-radius:999px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--txt-3);background:transparent;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--border-md);color:var(--txt)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:#FBCFE8;font-weight:500}
.chip.on.sp{background:#1E0E2A;border-color:#C084FC;color:#E9D5FF}
.chip.on.su{background:var(--green-dim);border-color:var(--green);color:#A7F3D0}
.chip.on.fa{background:var(--amber-dim);border-color:var(--amber);color:#FDE68A}
.chip.on.wi{background:var(--blue-dim);border-color:var(--blue);color:#BFDBFE}
.sb-reset{margin:9px 11px;padding:7px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--txt-3);font-size:11px;cursor:pointer;width:calc(100% - 22px);transition:.12s;text-align:center}
.sb-reset:hover{border-color:var(--border-md);color:var(--txt);background:var(--card-hover)}
.sb-reset.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* Topbar hidden */

/* Grid */
.grid-wrap{padding:16px 20px;flex:1}
.grid-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.grid-ttl{font-size:12px;color:var(--txt-3)}

/* 상단 통계 카드 — 의류 사이트와 동일 분위기 */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;transition:all .15s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;user-select:none}
.stat-card:hover{border-color:rgba(236,72,153,.3);transform:translateY(-2px);box-shadow:0 6px 18px rgba(236,72,153,.1)}
[data-theme="light"] .stat-card:hover{box-shadow:0 6px 18px rgba(236,72,153,.1)}
.stat-card.active{border-color:var(--accent);border-width:1.5px;background:var(--accent-dim);box-shadow:0 0 0 3px rgba(236,72,153,.15),0 6px 18px rgba(236,72,153,.12)}
.stat-card.active .stat-title{color:var(--accent);font-weight:700}
.stat-card.active::after{content:'✓';position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;color:var(--accent)}
.stat-title{font-size:11px;color:var(--txt-3);margin-bottom:8px;font-weight:500;letter-spacing:.02em}
.stat-value{font-size:26px;font-weight:700;color:var(--txt);letter-spacing:-.02em;line-height:1.1}
.stat-value.accent{color:var(--accent)}
.stat-value.green{color:var(--green)}
.stat-value.amber{color:var(--amber)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}

/* 단일 상태 필터 적용 시 — 한 컬럼 전체 차지 (그룹 1개만) */
.prod-grid.single-mode{display:flex;flex-direction:column;gap:14px}

/* 상태별 그룹 — 칸반 컬럼 형태 (가로 배치) */
.status-group{display:flex;flex-direction:column;gap:10px;min-width:0}
.status-group-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border)}
.status-group-title{font-size:13px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.status-group-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--txt-3);box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.status-group[data-st="생산요청"] .status-group-title::before{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.status-group[data-st="생산중"] .status-group-title::before{background:var(--accent);box-shadow:0 0 0 3px rgba(236,72,153,.15)}
.status-group[data-st="계속판매"] .status-group-title::before{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.status-group[data-st="대기"] .status-group-title::before{background:var(--txt-3);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.status-group[data-st="완료"] .status-group-title::before{background:#A855F7;box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.status-group[data-st="진행취소"] .status-group-title::before{background:var(--red);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
.status-group-count{font-size:11px;color:var(--txt-3);font-weight:600;padding:3px 10px;background:var(--card);border:1px solid var(--border);border-radius:999px}
.status-group-grid{display:flex;flex-direction:column;gap:7px}

/* Product card — 가로 행 형태 (한 줄에 하나) */
.pc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .15s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:row;align-items:center;padding:8px 14px;gap:14px;box-shadow:0 1px 2px rgba(236,72,153,.04)}
.pc:hover{border-color:rgba(236,72,153,.3);background:var(--card-hover);transform:translateX(2px);box-shadow:0 6px 18px rgba(236,72,153,.1)}
[data-theme="dark"] .pc:hover{box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pc.act{border-color:var(--accent);border-width:1.5px;box-shadow:0 0 0 3px rgba(236,72,153,.15),0 4px 16px rgba(236,72,153,.1)}
.pc-img{width:56px;height:56px;flex-shrink:0;background:var(--bg);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:10px}
.pc-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.pc:hover .pc-img img{transform:scale(1.06)}
.pc-ph{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--txt-3)}
.pc-ph svg{width:22px;height:22px;stroke:var(--txt-3);fill:none;opacity:.4}
.pc-ph span{display:none}
/* 가로 행에선 status pill, expand 버튼 숨김 — 그룹 헤더로 상태 파악 가능 */
.pc-expand{display:none}
.pc-status{display:none}
.pc-body{padding:0;flex:1;display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) auto;align-items:center;gap:14px}
.pc-top{display:flex;flex-direction:column;gap:2px;min-width:0}
.pc-name{font-size:13px;font-weight:700;color:var(--txt);letter-spacing:-.01em;line-height:1.3;word-break:keep-all;overflow-wrap:break-word}
.pc-style{font-size:10px;color:var(--txt-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--txt-3);border:1px solid var(--border)}
.pc-cols{display:flex;align-items:center;gap:5px}
.cdot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.cnames{font-size:10px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 컴팩트 메타 — 한 줄로 핵심 정보만 */
.pc-meta-compact{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-3);line-height:1.4;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc-meta-compact b{color:var(--txt-2);font-weight:600}
.pc-meta-compact .dot{opacity:.4;font-weight:700}
.pc-foot{display:flex;align-items:center;gap:12px;padding:0;border-top:none;margin:0}
.pc-qty{font-size:11px;color:var(--txt-3);white-space:nowrap}
.pc-qty b{color:var(--accent);font-weight:700;font-size:13px}
.wo-btn{display:flex;align-items:center;gap:3px;padding:4px 9px;border-radius:7px;font-size:10px;font-weight:600;border:1px solid var(--border-md);background:transparent;color:var(--txt-2);cursor:pointer;transition:.12s}
.wo-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.wo-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}

/* Status pills — 색상 점이 있는 트렌디한 pill */
.sp{font-size:10px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;letter-spacing:.02em;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.sp::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.s계속판매{background:var(--green-dim);color:var(--green);border-color:rgba(52,211,153,.25)}
.s생산중{background:var(--accent-dim);color:#FBCFE8;border-color:rgba(236,72,153,.3)}
.s생산요청{background:var(--amber-dim);color:var(--amber);border-color:rgba(251,191,36,.25)}
.s대기{background:rgba(255,255,255,.04);color:var(--txt-3);border-color:var(--border)}
.s완료{background:#1A0D2E;color:#C084FC;border-color:rgba(192,132,252,.25)}
.s진행취소{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,.25)}

.empty{padding:72px 20px;text-align:center;color:var(--txt-3)}
.empty svg{width:38px;height:38px;stroke:var(--txt-3);fill:none;display:block;margin:0 auto 11px;opacity:.3}

/* Work Order — 한 화면 2단 레이아웃 */
.wo{margin:0 20px 20px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.wo-head{padding:13px 18px 11px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(236,72,153,.06) 0%,transparent 60%)}
.wo-htop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wo-name{font-size:16px;font-weight:700;color:var(--txt);letter-spacing:-.02em}
.wo-meta{font-size:10px;color:var(--txt-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
.wo-meta span{display:flex;align-items:center;gap:3px}
.wo-meta svg{width:10px;height:10px;stroke:var(--txt-3);fill:none}
.wo-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.abtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;transition:.12s;border:1px solid var(--border-md);background:transparent;color:var(--txt-2)}
.abtn:hover{background:var(--card-hover);color:var(--txt)}
.abtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.abtn.pri{background:var(--accent);border-color:var(--accent);color:white}
.abtn.pri:hover{opacity:.88}
/* 2단: 왼쪽(사진+발주정보+원가) | 오른쪽(수량표+특이사항+히스토리) */
.wo-cols{display:grid;grid-template-columns:300px 1fr}
.wo-left{border-right:1px solid var(--border);display:flex;flex-direction:column}
.wo-imgmain{height:210px;background:var(--bg);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wo-imgmain img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.wo-imgmain:hover img{transform:scale(1.03)}
.wo-zoom{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 9px;font-size:10px;color:white;display:flex;align-items:center;gap:4px;opacity:0;transition:.15s;cursor:pointer}
.wo-imgmain:hover .wo-zoom{opacity:1}
.wo-zoom svg{width:11px;height:11px;stroke:white;fill:none;stroke-width:2}
.wo-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--txt-3)}
.wo-ph svg{width:36px;height:36px;stroke:var(--txt-3);fill:none;opacity:.3}
.wo-ph p{font-size:10px;opacity:.5;text-align:center;line-height:1.6}
.wo-info{padding:12px 14px;border-top:1px solid var(--border)}
.wo-info-2col{display:grid;grid-template-columns:1fr 1fr;gap:0}
.wo-info-sec{padding:12px 14px;border-top:1px solid var(--border)}
.wo-info-sec+.wo-info-sec{border-left:1px solid var(--border)}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ir{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border)}
.ir:last-child{border-bottom:none}
.ik{font-size:11px;color:var(--txt-3)}
.iv{font-size:11px;font-weight:500;color:var(--txt)}
.cost-box{background:var(--cost-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-top:8px;font-size:14px;color:var(--txt-3);line-height:2}
.cost-row{display:flex;justify-content:space-between}
.cost-total{border-top:1px solid var(--border-md);margin-top:7px;padding-top:7px;display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:var(--txt)}
.cost-retail{display:flex;justify-content:space-between;font-size:14px;color:var(--green);font-weight:600;margin-top:4px}

/* 원가 계산기 (인터랙티브) */
.cost-calc{display:flex;flex-direction:column;gap:11px;padding:14px;background:var(--cost-bg);border:1px solid var(--border);border-radius:10px;font-size:12px;margin-top:8px}
.cost-input-row{display:flex;flex-direction:column;gap:5px}
.cost-input-row > .cir-label{font-size:10px;color:var(--txt-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cost-input-wrap{display:flex;align-items:center;gap:6px}
.cost-input-wrap input{flex:1;padding:8px 11px;border:1px solid var(--border-md);border-radius:7px;background:var(--card);color:var(--txt);font-size:14px;font-weight:700;font-family:inherit;text-align:right}
.cost-input-wrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.cost-input-wrap .unit{font-size:12px;color:var(--txt-3);font-weight:600}
.cost-radio-group{display:flex;flex-direction:column;gap:5px}
.cost-radio-group label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--txt-2);padding:5px 8px;border:1px solid var(--border);border-radius:6px;transition:.12s}
.cost-radio-group label:has(input:checked){border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:600}
.cost-radio-group input[type="radio"]{accent-color:var(--accent);margin:0}
.cost-checkbox{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--txt-2);padding:5px 8px;border:1px solid var(--border);border-radius:6px;transition:.12s}
.cost-checkbox:has(input:checked){border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:600}
.cost-checkbox input{accent-color:var(--accent);margin:0}
.cost-result{display:flex;flex-direction:column;gap:3px;padding:11px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:11px}
.calc-line{display:flex;justify-content:space-between;color:var(--txt-3);font-variant-numeric:tabular-nums}
.calc-line.subtotal{color:var(--txt-2);font-weight:600;border-top:1px dashed var(--border);padding-top:5px;margin-top:3px}
.calc-line.total{color:var(--accent);font-weight:700;font-size:14px;border-top:1.5px solid var(--accent);padding-top:6px;margin-top:4px}
.calc-line.retail{color:var(--green);font-weight:800;font-size:14px}
.calc-divider{height:1px;background:var(--border);margin:6px 0}
.cost-save-btn{padding:9px 12px;border:none;background:linear-gradient(135deg,#FB7185,#EC4899);color:white;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;transition:.15s;font-family:inherit;letter-spacing:.02em}
.cost-save-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(236,72,153,.32)}
.cost-hist-section{margin-top:6px;padding-top:11px;border-top:1px solid var(--border)}
.cost-hist-title{font-size:10px;color:var(--txt-3);font-weight:700;margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase}
.cost-hist-item{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:10px;color:var(--txt-3);border-bottom:1px dashed var(--border);transition:.12s;border-radius:5px}
.cost-hist-item:hover{background:var(--card-hover)}
.cost-hist-item:last-child{border-bottom:none}
.cost-hist-item .hist-main{flex:1;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cost-hist-item .hist-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist-del-btn{width:22px;height:22px;border:1px solid var(--border);background:transparent;border-radius:5px;cursor:pointer;font-size:14px;color:var(--txt-3);flex-shrink:0;line-height:1;padding:0;display:grid;place-items:center;font-weight:700;transition:.12s;font-family:inherit}
.hist-del-btn:hover{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,.4)}
.cost-hist-item .hist-date{color:var(--accent);font-weight:700;font-size:10px}
.cost-hist-item .hist-retail{color:var(--green);font-weight:700;font-size:11px}
.cost-hist-item .hist-detail{font-size:9px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.cost-hist-empty{font-size:10px;color:var(--txt-3);text-align:center;padding:8px 0;font-style:italic}
/* 오른쪽 — flex column, 전체 높이 자동 확장 */
.wo-right{display:flex;flex-direction:column}
.wo-matrix{padding:12px 16px 10px;display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.mtx-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-shrink:0}
.mtx-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mtx-chips{display:flex;gap:5px}
.mtx-chip{padding:3px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(236,72,153,.3);font-size:12px;font-weight:600}
[data-theme="light"] .mtx-chip{background:#FCE7F3;color:#9F1239;border-color:rgba(219,39,119,.25)}
.mtx-wrap{overflow-x:auto;border-radius:7px;border:1px solid var(--border-md)}
.mtx{width:100%;border-collapse:collapse;font-size:13px}
.mtx th{padding:9px 11px;background:rgba(236,72,153,.1);color:var(--accent);font-weight:700;text-align:center;border-bottom:2px solid rgba(236,72,153,.25);font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
[data-theme="light"] .mtx th{background:rgba(219,39,119,.07);color:#9F1239;border-bottom-color:rgba(219,39,119,.2)}
.mtx th.lh{text-align:left;min-width:82px;padding-left:11px}
.mtx td{padding:9px 11px;text-align:center;border-bottom:1px solid var(--border);color:var(--txt);font-size:13px;font-weight:500;white-space:nowrap}
.mtx td.rh{text-align:left;font-weight:600;background:rgba(255,255,255,.03);padding-left:11px;border-right:1px solid var(--border)}
[data-theme="light"] .mtx td.rh{background:rgba(0,0,0,.02)}
.mtx td.rh .dw{display:flex;align-items:center;gap:7px}
.mtx td.rh .clr-bar{width:3px;height:18px;border-radius:3px;flex-shrink:0}
.mtx tr:last-child td{border-bottom:none}
.mtx tbody tr:hover td{background:rgba(236,72,153,.06)}
[data-theme="light"] .mtx tbody tr:hover td{background:rgba(219,39,119,.04)}
.mtx td.tot{font-weight:700;color:var(--accent);background:rgba(236,72,153,.1);border-left:1px solid rgba(236,72,153,.2)}
[data-theme="light"] .mtx td.tot{background:rgba(219,39,119,.07);color:#9F1239;border-left-color:rgba(219,39,119,.2)}
.mtx tr.trow td{background:rgba(236,72,153,.12);font-weight:700;color:var(--accent);border-top:2px solid rgba(236,72,153,.3)}
[data-theme="light"] .mtx tr.trow td{background:rgba(219,39,119,.08);color:#9F1239;border-top-color:rgba(219,39,119,.25)}
.mtx tr.trow td.tot{background:rgba(236,72,153,.22)}
[data-theme="light"] .mtx tr.trow td.tot{background:rgba(219,39,119,.15)}
.wo-rem{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--rem-bg)}
.rem-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.rem-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.rem-list li{display:flex;gap:8px;font-size:13px;color:var(--txt-2);line-height:1.55}
.rem-list li::before{content:'—';color:var(--amber);flex-shrink:0;font-weight:700}
.wo-hist{padding:9px 16px}
.hist-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-bottom:7px}
.hrow{display:flex;align-items:flex-start;gap:10px;padding:4px 0;border-bottom:1px solid var(--border)}
.hrow:last-child{border-bottom:none}
.hd{font-size:12px;color:var(--txt-3);min-width:78px;flex-shrink:0}
.ht{font-size:13px;color:var(--txt-2);flex:1}
.hb{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--mtx-head);color:var(--txt-3);border:1px solid var(--border);flex-shrink:0}

/* ── 인쇄 전용: A4 landscape, 모달 디자인 그대로 ── */
@media print {
  @page { size: A4 landscape; margin: 10mm; }

  .sidebar, .grid-wrap, .lb, #wo-wrap { display: none !important; }

  :root, [data-theme="dark"], [data-theme="light"] {
    --bg: #fff !important; --surface: #fff !important; --card: #fff !important;
    --card-hover: #fff !important;
    --border: #ddd !important; --border-md: #999 !important; --border-hi: #555 !important;
    --txt: #111 !important; --txt-2: #555 !important; --txt-3: #888 !important;
    --accent: #DB2777 !important; --accent-dim: #FCE7F3 !important;
    --green: #15803D !important; --green-dim: #F0FDF4 !important;
    --amber: #B45309 !important; --amber-dim: #FFFBEB !important;
    --red: #DC2626 !important; --red-dim: #FEF2F2 !important;
    --blue: #1D4ED8 !important; --blue-dim: #EFF6FF !important;
    --cost-bg: #F5F4F0 !important; --rem-bg: #FFFBEB !important; --mtx-head: #F5F5F5 !important;
  }
  html, body, .shell, .content {
    width: auto !important; height: auto !important;
    overflow: visible !important;
    background: #fff !important; color: #111 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .shell { display: block !important; }
  .content { display: block !important; padding: 0 !important; }

  /* 모달 배경 + 본체를 페이지 전체로 펼침 */
  .wo-modal-bg {
    position: static !important;
    display: block !important;
    background: none !important;
    padding: 0 !important;
    width: 100% !important; height: auto !important;
  }
  .wo-modal {
    width: 100% !important; height: auto !important; max-height: none !important;
    border: none !important; border-radius: 0 !important; box-shadow: none !important;
    background: #fff !important; overflow: visible !important;
  }
  .wo-modal-close, .wo-modal-actions .abtn, .wo-modal-imgzoom { display: none !important; }
  /* 인쇄(PDF 저장) 시 원가 계산기 (내부용) 완전 제거 — 업체 발송용 */
  #wm-info { display: none !important; }

  .wo-modal-head {
    padding: 10px 16px !important;
    background: linear-gradient(135deg, rgba(236,72,153,.06), transparent) !important;
    border-bottom: 1.5px solid #ccc !important;
    page-break-after: avoid;
    backdrop-filter: none !important;
    position: static !important;
  }
  .wo-modal-title { font-size: 16px !important; color: #111 !important; }
  .wo-modal-sub { font-size: 10px !important; color: #555 !important; }

  .wo-modal-body {
    display: grid !important;
    grid-template-columns: 280px 1fr !important;
    overflow: visible !important;
    height: auto !important;
    flex: none !important;
  }
  .wo-modal-left { border-right: 1px solid #ddd !important; overflow: visible !important; height: auto !important; }
  .wo-modal-right { overflow: visible !important; height: auto !important; }

  .wo-modal-imgbox { height: 200px !important; cursor: default !important; background: #f5f5f5 !important; }
  .wo-modal-imgbox img { object-fit: cover; }
  .wo-ph svg { stroke: #aaa !important; }

  .wo-modal-info { padding: 12px 14px !important; }
  .sec-t { font-size: 9px !important; margin-bottom: 5px !important; color: #DB2777 !important; }
  .ir { padding: 3px 0 !important; border-bottom: 1px solid #eee !important; }
  .ir:last-child { border-bottom: none !important; }
  .ik { font-size: 10px !important; color: #555 !important; }
  .iv { font-size: 10px !important; color: #111 !important; font-weight: 600 !important; }
  .cost-box {
    background: #F5F4F0 !important;
    border: 1px solid #ddd !important;
    font-size: 10px !important;
    padding: 7px 9px !important;
  }
  .cost-total { font-size: 11px !important; }
  .cost-retail { font-size: 10px !important; color: #15803D !important; }

  .wo-modal-mtx { padding: 10px 14px 6px !important; border-bottom: 1px solid #eee !important; page-break-inside: avoid; }
  .mtx-lbl { font-size: 8px !important; color: #DB2777 !important; }
  .mtx-chip {
    background: #FCE7F3 !important;
    color: #9F1239 !important;
    border-color: #F9A8D4 !important;
    font-size: 9px !important;
    padding: 1px 7px !important;
  }
  .mtx-wrap { border: 1px solid #ddd !important; border-radius: 4px !important; }
  .mtx { font-size: 9px !important; }
  .mtx th {
    padding: 5px 6px !important;
    background: #FCE7F3 !important;
    color: #9F1239 !important;
    font-size: 9px !important;
    border-bottom: 1.5px solid #F9A8D4 !important;
  }
  .mtx td {
    padding: 4px 6px !important;
    font-size: 9px !important;
    color: #111 !important;
    border-bottom: 1px solid #eee !important;
  }
  .mtx td.rh { background: #fafafa !important; border-right: 1px solid #eee !important; }
  .mtx td.tot { background: #FCE7F3 !important; color: #9F1239 !important; font-weight: 700 !important; }
  .mtx tr.trow td { background: #E8E4FF !important; color: #9F1239 !important; }
  .mtx tr.trow td.tot { background: #D4CAFF !important; }
  .mtx td.rh .clr-bar { width: 3px !important; height: 12px !important; }

  .wo-modal-rem {
    padding: 8px 14px !important;
    background: #FFFBEB !important;
    border-bottom: 1px solid #eee !important;
    page-break-inside: avoid;
  }
  .rem-t { font-size: 9px !important; color: #92400E !important; }
  .rem-list li { font-size: 9px !important; line-height: 1.4 !important; color: #444 !important; }
  .rem-list li::before { color: #D97706 !important; }

  .wo-modal-info .rem-list li { font-size: 10px !important; color: #333 !important; }
  .wo-modal-info .rem-list li::before { color: #DB2777 !important; }

  .wo-modal-hist { padding: 8px 14px !important; page-break-inside: avoid; }
  .hist-t { font-size: 9px !important; color: #555 !important; }
  .hrow { padding: 3px 0 !important; gap: 8px !important; border-bottom: 1px solid #eee !important; }
  .hd { font-size: 9px !important; color: #888 !important; min-width: 60px !important; }
  .ht { font-size: 9px !important; color: #444 !important; }
  .hb { font-size: 8px !important; padding: 1px 6px !important; background: #f5f5f5 !important; border: 1px solid #ddd !important; color: #666 !important; }

  .cdot { border-color: #ccc !important; }
}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.lb.open{display:flex}
.lb-box{position:relative;max-width:760px;width:100%;background:var(--surface);border:1px solid var(--border-md);border-radius:12px;overflow:hidden}
.lb-img{width:100%;max-height:68vh;object-fit:contain;background:var(--bg);display:block}
.lb-ph{height:360px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);color:var(--txt-3)}
.lb-ph svg{width:52px;height:52px;stroke:var(--txt-3);fill:none;opacity:.3}
.lb-ph p{font-size:12px;opacity:.5}
.lb-info{padding:13px 17px;border-top:1px solid var(--border)}
.lb-name{font-size:14px;font-weight:600;color:var(--txt)}
.lb-sub{font-size:11px;color:var(--txt-3);margin-top:3px}
.lb-close{position:absolute;top:10px;right:10px;width:29px;height:29px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:7px;display:grid;place-items:center;cursor:pointer;color:white;font-size:16px;transition:.12s}
.lb-close:hover{background:rgba(255,255,255,.12)}

/* ── 작업지시서 모달 ── */
.wo-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.wo-modal-bg.open{display:flex}
.wo-modal{background:var(--card);border:1px solid var(--border-md);border-radius:16px;width:min(98vw,1280px);height:92vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.wo-modal-head{padding:16px 24px 14px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(236,72,153,.07)0%,transparent 60%);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;position:sticky;top:0;z-index:1;backdrop-filter:blur(6px)}
.wo-modal-title{font-size:22px;font-weight:700;color:var(--txt);letter-spacing:-.01em}
.wo-modal-sub{font-size:12px;color:var(--txt-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.wo-modal-sub span{display:flex;align-items:center;gap:3px}
.wo-modal-actions{display:flex;gap:8px;align-items:center}
.wo-modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border-md);background:transparent;color:var(--txt-3);cursor:pointer;display:grid;place-items:center;transition:.12s;flex-shrink:0}
.wo-modal-close:hover{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,.3)}
.wo-modal-body{display:grid;grid-template-columns:480px 1fr;flex:1;overflow:hidden}
.wo-modal-left{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.wo-modal-imgbox{height:460px;background:var(--bg);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wo-modal-imgbox img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.wo-modal-imgbox:hover img{transform:scale(1.03)}
.wo-modal-imgzoom{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 11px;font-size:11px;color:white;display:flex;align-items:center;gap:5px;opacity:0;transition:.15s}
.wo-modal-imgbox:hover .wo-modal-imgzoom{opacity:1}
.wo-modal-imgzoom svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:2}
.wo-modal-info{padding:16px 18px}
.wo-modal-right{display:flex;flex-direction:column;overflow-y:auto}
.wo-modal-mtx{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column}
.wo-modal-rem{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--rem-bg)}
.wo-modal-hist{padding:14px 20px}

/* ─── 새 작업지시서 포맷 (의류 사이트와 동일 분위기) ─── */
.wo-modal.wo-doc{width:min(96vw,1280px);height:auto;max-height:96vh;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.wo-doc-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.wo-doc-body{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0;overflow:hidden}
.wd-page{background:white;color:#111;padding:14px 18px 16px;overflow-y:auto;min-height:0}
.wd-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:0.5em;color:#111;padding:4px 0 12px;font-family:inherit}
.wd-meta-tbl{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}
.wd-meta-tbl th,.wd-meta-tbl td{border:1px solid #666;padding:6px 5px;text-align:center;vertical-align:middle;color:#111;word-break:keep-all}
.wd-meta-tbl th{background:#e8e8e8;font-weight:700;color:#333;font-size:10px}
.wd-meta-tbl td{font-weight:700;font-size:11px}
.wd-main{display:grid;grid-template-columns:1.3fr 1.3fr 0.7fr;gap:0;margin-top:0}
.wd-col{border-top:1px solid #666;border-left:1px solid #666;border-bottom:1px solid #666;display:flex;flex-direction:column;background:white;min-width:0}
.wd-col:last-child{border-right:1px solid #666}
.wd-img{flex:1;background:white;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #666;padding:8px;cursor:pointer}
.wd-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.wd-img-ph{color:#999;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.wd-img-ph svg{width:36px;height:36px;stroke:#ccc;fill:none;stroke-width:1}
.wd-warn{display:flex;flex-direction:column;border-top:1px solid #666}
.wd-warn-t{background:#e8e8e8;padding:6px 10px;font-size:11px;font-weight:700;border-bottom:1px solid #666;color:#333;text-align:center}
.wd-warn-c{padding:8px 11px;font-size:9.5px;color:#DC2626;font-weight:600;line-height:1.55;min-height:0;flex:0 0 auto}
.wd-qty-box,.wd-spec-box,.wd-center-box{display:flex;flex-direction:column}

/* 중앙 부자재 영역 (수량표 아래) */
.wd-sub-supplies{display:grid;grid-template-columns:0.5fr 1fr;border-top:1px solid #666;flex-shrink:0}
.wd-sub-supplies-l{background:#e8e8e8;padding:14px 8px;font-size:11px;font-weight:700;color:#333;text-align:center;border-right:1px solid #666;display:flex;align-items:center;justify-content:center;line-height:1.4}
.wd-sub-supplies-r{padding:10px;min-height:64px;display:flex;align-items:center;justify-content:center;background:white;font-size:10.5px;color:#333;text-align:center;line-height:1.5;flex-wrap:wrap;gap:4px;word-break:keep-all}
.wd-sub-supplies-r img{max-width:100%;max-height:80px;object-fit:contain}
.wd-sub-supplies-r .muted{color:#999;font-style:italic}
.wd-section-t{background:#e8e8e8;padding:6px 10px;font-size:11px;font-weight:700;border-bottom:1px solid #666;color:#333;text-align:center}
.wd-qty-tbl{width:100%;border-collapse:collapse;font-size:11px}
.wd-qty-tbl th,.wd-qty-tbl td{border:1px solid #888;padding:5px 6px;text-align:center;color:#111}
.wd-qty-tbl th{background:#f5f5f5;font-weight:700;font-size:10px}
.wd-qty-tbl td.rh{text-align:center;font-weight:700;background:#fafafa}
.wd-qty-tbl td.tot{background:#fafafa;font-weight:700;color:var(--accent)}
.wd-qty-tbl tr.sum td{background:#fafafa;font-weight:700}
.wd-qty-tbl tr.sum td.tot{background:#ffeef5}
.wd-spec-tbl{width:100%;border-collapse:collapse;font-size:11px}
.wd-spec-tbl tr{border-bottom:1px solid #aaa}
.wd-spec-tbl tr:last-child{border-bottom:none}
.wd-spec-tbl td{padding:8px 10px;text-align:center;color:#111;vertical-align:middle}
.wd-spec-tbl td:first-child{background:#e8e8e8;font-weight:700;color:#333;width:45%;border-right:1px solid #888;font-size:11px}
.wd-spec-tbl td:last-child{font-weight:600}
.wd-spec-tbl td.muted{color:#999;font-weight:400;font-style:italic}
/* LED 행 강조 — 발주 수량표의 '계' 박스 컬러와 동일 */
.wd-spec-tbl tr.led td,
.wd-spec-tbl tr.led td:first-child{background:#ffeef5!important;color:var(--accent)!important;font-weight:800}
/* OZKIZ 푸터 로고 (작업지시서 맨 아래 — 제목과 같은 크기) */
.wd-footer{text-align:center;padding:14px 0 4px;margin-top:8px}
.wd-logo{display:inline-block;font-size:22px;font-weight:900;color:#E11D48;letter-spacing:-0.02em;font-family:'Arial Black',-apple-system,'Helvetica Neue',Arial,sans-serif;line-height:1;position:relative}
.wd-logo-i{position:relative;display:inline-block}
.wd-logo-star{position:absolute;top:-0.5em;left:50%;transform:translateX(-50%);font-size:0.4em;color:#E11D48;line-height:1}

/* 원가 계산기 (좌측, 내부용 — 인쇄/캡처 자동 제외) */
.wo-doc-cost{padding:14px 16px;border-right:2px dashed var(--border-md);background:var(--cost-bg);overflow-y:auto;min-height:0}
.wo-doc-cost::-webkit-scrollbar{width:5px}
.wo-doc-cost::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:3px}

/* 작업지시서 정보 표 — 엑셀 형식 */
.wo-modal-info-tbl{padding:14px 18px;border-bottom:1px solid var(--border)}
.wo-modal-supplies{padding:12px 18px;border-bottom:1px solid var(--border)}
.info-tbl{width:100%;border-collapse:collapse;font-size:13px}
.info-tbl th,.info-tbl td{border:1px solid var(--border-md);padding:9px 12px;text-align:left;vertical-align:middle}
.info-tbl th{background:var(--mtx-head);font-weight:600;color:var(--txt-2);width:13%;white-space:nowrap;font-size:12px;letter-spacing:.03em}
.info-tbl td{color:var(--txt);font-weight:500;width:37%;word-break:break-word}
[data-theme="light"] .info-tbl th{background:rgba(0,0,0,0.03)}
.supplies-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 14px}
.supplies-list li{font-size:13px;color:var(--txt-2);padding:4px 0;display:flex;gap:6px;line-height:1.5}
.supplies-list li::before{content:'—';color:var(--accent);flex-shrink:0;font-weight:600}

/* 사진 복사 미리보기 모달 */
.img-copy-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.img-copy-bg.open{display:flex}
.img-copy{background:var(--card);border:1px solid var(--border-md);border-radius:14px;width:min(94vw,860px);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.img-copy-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(236,72,153,.06),transparent)}
.img-copy-title{font-size:15px;font-weight:700;color:var(--txt)}
.img-copy-sub{font-size:11px;color:var(--txt-3);margin-top:3px;transition:.2s}
.img-copy-sub.success{color:var(--green);font-weight:600}
.img-copy-sub.error{color:var(--amber)}
.img-copy-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-md);background:transparent;color:var(--txt-3);cursor:pointer;display:grid;place-items:center;transition:.12s}
.img-copy-close:hover{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,.3)}
.img-copy-body{padding:16px;overflow:auto;background:var(--bg);text-align:center;flex:1;min-height:200px;display:flex;align-items:center;justify-content:center}
.img-copy-body img{max-width:100%;max-height:60vh;border:1px solid var(--border);border-radius:8px;background:white;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.img-copy-body img:not([src]),.img-copy-body img[src=""]{display:none}
.img-copy-loading{color:var(--txt-3);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.img-copy-loading::before{content:'';width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.img-copy-actions{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.img-copy-actions .abtn{padding:8px 16px;font-size:12px}

/* 토스트 알림 — 우측 하단에 잠시 떠올랐다 사라짐 */
.ozk-toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1.5px solid var(--border);padding:13px 20px;border-radius:12px;font-size:13px;font-weight:600;color:var(--txt);box-shadow:0 12px 32px rgba(0,0,0,.12);z-index:9999;opacity:0;transform:translateY(20px);transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;display:flex;align-items:center;gap:10px;max-width:380px}
.ozk-toast.show{opacity:1;transform:translateY(0)}
.ozk-toast.success{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.ozk-toast.error{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.ozk-toast.info{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.ozk-toast.loading::before{content:'';width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:3px}
</style>
</head>
<body>


<!-- 작업지시서 모달 (새 포맷 — 의류 사이트와 동일 분위기) -->
<div class="wo-modal-bg" id="wo-modal-bg" onclick="closeWOModal(event)">
  <div class="wo-modal wo-doc" id="wo-modal">
    <!-- 액션 버튼 (모달 상단, 인쇄/캡처 대상 밖) -->
    <div class="wo-doc-actions">
      <button class="abtn" onclick="saveAsImage()" title="카톡으로 보낼 사진 — 원가 계산기 제외, 클립보드 자동 복사">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        사진 복사
      </button>
      <button class="abtn pri" onclick="printWO()" title="업체 발송용 PDF — 원가 계산기 제외">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="white" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PDF 저장
      </button>
      <button class="wo-modal-close" onclick="closeWOModal()" title="닫기">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- 본문: 좌(원가 계산기) + 우(작업지시서) -->
    <div class="wo-doc-body">
      <!-- 좌측: 원가 계산기 (내부용 — 인쇄/캡처 자동 제외) -->
      <div id="wm-info" class="wo-doc-cost"></div>

      <!-- 우측: 인쇄/캡처 대상 = 작업지시서 -->
      <div class="wd-page" id="wd-page">
        <div class="wd-title">작 업 지 시 서</div>

        <!-- 메타 정보 표 (9 컬럼) — 사용자 지정 순서 -->
        <table class="wd-meta-tbl">
          <thead>
            <tr>
              <th>STYLE NO</th>
              <th>상품명</th>
              <th>차수</th>
              <th>작업처</th>
              <th>담당</th>
              <th>실장</th>
              <th>발주일</th>
              <th>입고 예정일</th>
              <th>업체단가</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="wd-style"></td>
              <td id="wd-name"></td>
              <td id="wd-round"></td>
              <td id="wd-vendor"></td>
              <td id="wd-manager"></td>
              <td id="wd-deputy"></td>
              <td id="wd-order-date"></td>
              <td id="wd-arrival-date"></td>
              <td id="wd-uv"></td>
            </tr>
          </tbody>
        </table>

        <!-- 본문 3단: 좌(이미지) / 중(수량표 + 부자재 + 주의) / 우(제품사양) -->
        <div class="wd-main">
          <div class="wd-col wd-img-box">
            <div class="wd-img" id="wd-img" onclick="openLBfromModal()"></div>
          </div>
          <div class="wd-col wd-center-box">
            <div class="wd-section-t">발주 수량</div>
            <div id="wd-qty"></div>
            <div class="wd-sub-supplies">
              <div class="wd-sub-supplies-l">오즈키즈 제공<br>부자재</div>
              <div class="wd-sub-supplies-r" id="wd-supplies-img"></div>
            </div>
            <div class="wd-warn">
              <div class="wd-warn-t">주의 사항</div>
              <div class="wd-warn-c" id="wd-warn-c"></div>
            </div>
          </div>
          <div class="wd-col wd-spec-box">
            <div class="wd-section-t">제품 사양</div>
            <table class="wd-spec-tbl" id="wd-spec"></table>
          </div>
        </div>

        <!-- 푸터 — OZKIZ 로고 -->
        <div class="wd-footer">
          <span class="wd-logo">
            OZK<span class="wd-logo-i">i<span class="wd-logo-star">★</span></span>Z
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 사진 복사 미리보기 모달 -->
<div class="img-copy-bg" id="img-copy-bg" onclick="closeImageCopy(event)">
  <div class="img-copy">
    <div class="img-copy-head">
      <div>
        <div class="img-copy-title">📷 작업지시서 사진</div>
        <div class="img-copy-sub" id="img-copy-hint">캡처 중...</div>
      </div>
      <button class="img-copy-close" onclick="closeImageCopy()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="img-copy-body">
      <img id="img-copy-content" alt="작업지시서 미리보기">
    </div>
    <div class="img-copy-actions">
      <button class="abtn" onclick="copyImageToClipboard()">📋 클립보드 복사</button>
      <button class="abtn pri" onclick="downloadCurrentImage()">⬇ 파일로 저장</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLB(event)">
  <div class="lb-box">
    <div class="lb-close" onclick="closeLB()">✕</div>
    <div id="lb-img"></div>
    <div class="lb-info"><div class="lb-name" id="lb-nm"></div><div class="lb-sub" id="lb-sb"></div></div>
  </div>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-brand-mark">
          <svg viewBox="0 0 24 24" fill="white"><path d="M3 17.5C3 15.57 4.57 14 6.5 14h11c1.93 0 3.5 1.57 3.5 3.5S19.43 21 17.5 21h-11C4.57 21 3 19.43 3 17.5z"/><path d="M2 11l4-7h12l4 7" stroke="white" stroke-width="1.5" fill="none"/></svg>
        </div>
        <div class="sb-brand-name">OZKIZ</div>
        <div class="sb-brand-sub">제품디자인팀</div>
      </div>
    </div>
    <div class="sb-category">
      <div class="sb-section-label">CATEGORY</div>
      <div class="sb-cat-grid">
        <button class="sb-cat-btn" onclick="window.open('https://loreen-order-project.vercel.app/','_blank','noopener')" title="의류 작업지시서로 이동 (새 창에서 열림)">
          <div class="sb-cat-icon">👗</div>
          <div class="sb-cat-name">의류</div>
        </button>
        <button class="sb-cat-btn active" title="슈즈 (현재 보드)">
          <div class="sb-cat-icon">👟</div>
          <div class="sb-cat-name">슈즈</div>
        </button>
      </div>
    </div>
    <div class="sb-tools">
      <div class="notion-tag"><span class="notion-dot"></span>노션 연동중</div>
      <button id="refresh-btn" class="theme-btn" onclick="forceRefresh()" title="노션 데이터 강제 새로고침" style="font-size:13px">↻</button>
      <button class="theme-btn" onclick="toggleTheme()" title="라이트 / 다크 전환">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
    <div class="sb-search">
      <div class="s-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="srch" type="text" placeholder="스타일명 검색..." oninput="debouncedRender()">
      </div>
    </div>
    <div class="sb-filters" id="sb-filters"></div>
    <button class="sb-reset" id="reset-btn" onclick="resetAll()">필터 초기화</button>
  </aside>

  <div class="content">
    <div class="grid-wrap">
      <div class="stats-row" id="stats-row"></div>
      <div class="grid-hdr"><div class="grid-ttl" id="grid-ttl"></div></div>
      <div class="prod-grid" id="prod-grid"></div>
    </div>
    <div id="wo-wrap"></div>
  </div>
</div>

<script>
const CHX={'퍼플':'#A78BFA','핑크':'#F9A8D4','화이트':'#D1D5DB','블랙':'#4B5563','아이보리':'#FDE68A','네이비':'#3B82F6','민트':'#6EE7B7','코랄':'#FCA5A5','스카이블루':'#BAE6FD','브라운':'#A16207','카키':'#84CC16','라벤더':'#DDD6FE'};
const SC={봄:'sp',여름:'su',가을:'fa',겨울:'wi'};
const FDEFS=[
  {k:'vendor',lbl:'업체',ico:'<circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/>'},
  {k:'region',lbl:'생산지역',ico:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'},
  {k:'year',lbl:'개발년도',ico:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
  {k:'cat',lbl:'카테고리',ico:'<path d="M3 17.5C3 15.57 4.57 14 6.5 14h11c1.93 0 3.5 1.57 3.5 3.5S19.43 21 17.5 21h-11C4.57 21 3 19.43 3 17.5z"/><path d="M2 11l4-7h12l4 7"/>'},
  {k:'season',lbl:'시즌',ico:'<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>'},
  {k:'status',lbl:'진행상태',ico:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'},
];
let PRODS=[];

let F={vendor:'전체',region:'전체',year:'전체',cat:'전체',season:'전체',status:'전체'};
let _statusFilter=null;  // 통계 카드 클릭으로 필터링되는 상태 (null = 전체)
let selId=null;
const $=id=>document.getElementById(id);
const N=n=>(n??0).toLocaleString('ko-KR');
const D=d=>d?d.replace(/-/g,'.'):'-';
const tQ=ord=>ord.reduce((s,r)=>s+r.q,0);

// ─── 원가 계산기 + 히스토리 ───
// 카테고리 기반 기본 부자재 금액
function defaultSupplies(p){
  const cat=(p.cat||'').toLowerCase();
  if(cat.includes('부츠'))return 800;
  return 550;  // 구두/슬립온 기본
}
// 원가/판매가 계산 (원산지 대한민국 기준)
function calcCost(uv,supplies,hasLED){
  uv=parseInt(uv)||0;
  supplies=parseInt(supplies)||0;
  const ledCost=hasLED?1650:0;
  const sub=uv+supplies+ledCost;
  const cost=Math.round(sub*1.1);
  const retailRaw=cost*4;
  const retail=Math.round(retailRaw/1000)*1000;  // 1000원 단위 반올림
  return {uv,supplies,ledCost,hasLED,sub,cost,retailRaw,retail};
}

function mtx(ord){
  const cs=[...new Set(ord.map(r=>r.c))];
  const sz=[...new Set(ord.map(r=>r.s))].sort((a,b)=>a-b);
  const m={};ord.forEach(r=>{if(!m[r.c])m[r.c]={};m[r.c][r.s]=(m[r.c][r.s]||0)+r.q});
  return{cs,sz,m};
}

// 외부 이미지를 /api/img-proxy로 fetch → base64 data URL로 변환 (CORS 완전 우회)
async function fetchAsDataUrl(url,timeoutMs){
  timeoutMs=timeoutMs||8000;
  const controller=new AbortController();
  const t=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const r=await fetch('/api/img-proxy?url='+encodeURIComponent(url),{signal:controller.signal});
    if(!r.ok){console.warn('img-proxy 실패:',r.status,url);return null;}
    const blob=await r.blob();
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onloadend=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error('FileReader 실패'));
      reader.readAsDataURL(blob);
    });
  }catch(e){
    console.warn('fetchAsDataUrl 에러:',e.message);
    return null;
  }finally{
    clearTimeout(t);
  }
}

  if(!selId)return;

  // 캡처 대상 = #wd-page (작업지시서 영역만). 좌측 원가 계산기는 자동 제외.

  const hideEls=target.querySelectorAll('.wo-modal-close, .wo-modal-actions, .wo-modal-imgzoom');
  hideEls.forEach(el=>el.style.visibility='hidden');

  // 노션 이미지(S3)는 CORS 막힘 — base64로 완전 변환해서 html2canvas에 박음
  // file:// 미리보기나 claude.ai에선 프록시 호출 못 하므로 그 환경은 skip
  const canProxy=(location.protocol==='https:'||location.protocol==='http:')&&
                 !location.hostname.includes('claude')&&
                 !location.hostname.includes('anthropic');
  const imgs=Array.from(target.querySelectorAll('img'));
  const originalSrcs=new Map();

  if(canProxy&&imgs.length>0){
    const external=imgs.filter(img=>img.src&&img.src.startsWith('http')&&!img.src.startsWith(location.origin));
    console.log('[saveAsImage] 외부 이미지',external.length,'개 base64 변환 시작');
    for(let i=0;i<external.length;i++){
      const img=external[i];
      const src=img.src;
      body.innerHTML=`<div class="img-copy-loading">이미지 다운로드 중 (${i+1}/${external.length})...</div>`;
      try{
        const dataUrl=await fetchAsDataUrl(src,8000);
        if(dataUrl){
          originalSrcs.set(img,src);
          img.src=dataUrl;
          // base64 로드 대기 (즉시 끝나야 함)
          await new Promise(r=>{
            if(img.complete&&img.naturalHeight>0)return r();
            const t=setTimeout(r,2000);
            img.onload=()=>{clearTimeout(t);r();};
            img.onerror=()=>{clearTimeout(t);r();};
          });
          console.log('[saveAsImage] 이미지',i+1,'변환 완료, base64 길이:',dataUrl.length);
        }else{
          console.warn('[saveAsImage] 이미지',i+1,'변환 실패 — 빈 칸으로 진행');
          // 변환 실패 시 빈 placeholder로 (hang 방지)
          originalSrcs.set(img,src);
          img.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjwvc3ZnPg==';
        }
      }catch(e){
        console.error('[saveAsImage] 이미지',i+1,'에러:',e);
      }
    }
    console.log('[saveAsImage] 모든 이미지 처리 완료');
  }

  body.innerHTML='<div class="img-copy-loading">사진 변환 중...<br><span style="font-size:11px;color:var(--txt-3);margin-top:6px">최대 30초 소요</span></div>';
  console.log('[saveAsImage] html2canvas 시작, 대상 크기:',target.offsetWidth,'x',target.offsetHeight);

  try{
    // 30초 강제 타임아웃 — 정의된 시간 안에 끝나지 않으면 에러
    const canvasPromise=html2canvas(target,{
      backgroundColor:'#ffffff',
      scale:1.5,
      useCORS:true,
      allowTaint:false,
      logging:false,
      imageTimeout:4000,
      foreignObjectRendering:false,
      removeContainer:true
    });
    const timeoutPromise=new Promise((_,rej)=>setTimeout(
      ()=>rej(new Error('30초 초과 — 캡처가 너무 오래 걸렸어요. 새로고침 후 다시 시도해주세요.')),
      30000
    ));
    const canvas=await Promise.race([canvasPromise,timeoutPromise]);
    console.log('[saveAsImage] html2canvas 완료, 캔버스 크기:',canvas.width,'x',canvas.height);

    // 미리보기 이미지 표시
    let dataUrl;
    try{ dataUrl=canvas.toDataURL('image/png'); }
    catch(secErr){
      console.error('[saveAsImage] toDataURL SecurityError:',secErr);
      throw new Error('CORS 제한으로 이미지 변환 실패. 다시 시도하면 될 수도 있어요.');
    }
    body.innerHTML=`<img src="${dataUrl}" alt="작업지시서 미리보기">`;
    console.log('[saveAsImage] 미리보기 표시 완료');

    // Blob 변환 후 자동 클립보드 복사
    canvas.toBlob(async blob=>{
      if(!blob){
        hint.className='img-copy-sub error';
        hint.textContent='이미지 생성 실패 — 다시 시도해주세요';
        return;
      }
      _currentImageBlob=blob;
      console.log('[saveAsImage] Blob 생성 완료, 크기:',blob.size,'bytes');
      tryAutoCopyClipboard();
    },'image/png');
  }catch(e){
    hint.className='img-copy-sub error';
    hint.textContent='캡처 실패';
    body.innerHTML=`<div style="color:var(--red);padding:40px;text-align:center;font-size:13px">캡처 실패<br><br><span style="font-size:11px;color:var(--txt-3)">${e.message}</span><br><br><button class="abtn" onclick="saveAsImage()" style="margin-top:8px">다시 시도</button></div>`;
    console.error('[saveAsImage] 에러:',e);
  }finally{
    hideEls.forEach(el=>el.style.visibility='');
    // 이미지 src 원복
    originalSrcs.forEach((src,img)=>{
      img.crossOrigin=null;
      img.src=src;
    });
  }
};

async function tryAutoCopyClipboard(){
  const hint=$('img-copy-hint');
  if(!_currentImageBlob)return;
  if(typeof ClipboardItem==='undefined'||!navigator.clipboard||!navigator.clipboard.write){
    hint.className='img-copy-sub';
    hint.innerHTML='이 브라우저는 자동 복사를 지원 안 해요 — "<b>⬇ 파일로 저장</b>" 사용해주세요';
    return;
  }
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':_currentImageBlob})]);
    hint.className='img-copy-sub success';
    hint.innerHTML='✓ 클립보드에 자동 복사됨! 카톡에서 <b>Ctrl + V</b>로 붙여넣기';
  }catch(e){
    hint.className='img-copy-sub';
    hint.innerHTML='💡 자동 복사 안 됨 — "<b>📋 클립보드 복사</b>" 버튼을 직접 눌러주세요';
  }
}

  let t=document.getElementById('ozk-toast');
  if(!t){
    t=document.createElement('div');
    t.id='ozk-toast';
    t.className='ozk-toast';
    document.body.appendChild(t);
  }
  t.className='ozk-toast '+type;
  t.textContent=msg;
  // reflow trick
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._timer);
  if(duration>0){
    t._timer=setTimeout(()=>t.classList.remove('show'),duration);
  }
  return t;
};
window.hideToast=()=>{
  const t=document.getElementById('ozk-toast');
  if(t)t.classList.remove('show');
};

// 강제 새로고침: localStorage + 브라우저 캐시 + 서버 인메모리 캐시 모두 무효화
window.forceRefresh=async()=>{
  const btn=$('refresh-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  showToast('노션 데이터 새로고침 중...','loading',0);  // 자동 사라짐 X
  try{localStorage.removeItem(OZK_CACHE_KEY);}catch(e){}
  try{
    const r=await fetch('/api/products?revalidate=1',{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
  }catch(e){
    showToast('새로고침 실패: '+e.message,'error',3500);
    if(btn){btn.disabled=false;btn.textContent='↻';}
    return;
  }
  showToast('✓ 새로고침 완료! 페이지 다시 불러옵니다','success',1200);
  await new Promise(r=>setTimeout(r,900));  // 토스트 잠깐 보이게
  // 강제 fresh navigation — URL에 timestamp 붙여서 브라우저 캐시 우회
  const url=new URL(location.href);
  url.searchParams.set('_t',Date.now());
  location.replace(url.toString());
};

function normalizeProduct(p){
  const r=Object.assign({
    vendor:'-',region:'-',cat:'-',season:'-',last:'',fabric:'',
    type:'-',brand:'오즈키즈',moq:null,gender:null,manager:'',
    uv:0,us:0,ue:0,ur:1,uc:0,rt:0,ed:'',kcStatus:'',
    rem:[],hist:[],ord:[],kcFiles:[],supplies:[]
  },p);
  // supplies 호환성 — 문자열 배열로 들어왔으면 객체 배열로 변환
  r.supplies=(r.supplies||[]).map(s=>typeof s==='string'?{text:s,url:null}:(s&&s.text?s:{text:String(s||''),url:null})).filter(s=>s.text);
  return r;
}

async function loadData(){
  // 미리보기 모드 감지: file:// 더블클릭, Claude Artifact, 또는 ?preview 쿼리
  const isPreview = location.protocol==='file:' ||
                    location.hostname.includes('claude') ||
                    location.hostname.includes('anthropic') ||
                    location.search.includes('preview');
  if(isPreview){
    PRODS.length=0;PRODS.push(...SAMPLE_DATA.map(normalizeProduct));
    renderFilters();render();
    const ttl=$('grid-ttl');
    if(ttl)ttl.textContent='🔍 미리보기 모드 — 샘플 2개 (배포 후 vercel.app에선 실제 노션 데이터)';
    return;
  }
  const grid=$('prod-grid');
  const ttl=$('grid-ttl');
  // 1) localStorage 캐시가 신선하면 즉시 표시
  let usedCache=false;
  try{
    const raw=localStorage.getItem(OZK_CACHE_KEY);
    if(raw){
      const {data,ts}=JSON.parse(raw);
      if(Array.isArray(data)&&data.length&&(Date.now()-ts)<OZK_CACHE_TTL){
        PRODS.length=0;PRODS.push(...data.map(normalizeProduct));
        renderFilters();render();
        usedCache=true;
        if(ttl)ttl.textContent='저장된 데이터 (백그라운드 갱신중...)';
      }
    }
  }catch(e){}
  // 캐시 없으면 로딩 표시
  if(!usedCache){
    if(ttl)ttl.textContent='노션에서 불러오는 중...';
    if(grid)grid.innerHTML='<div class="empty"><p>노션에서 데이터 불러오는 중...</p></div>';
  }
  // 2) 백그라운드에서 최신 데이터 가져오기
  try{
    const r=await fetch('/api/products');
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||('HTTP '+r.status));}
    const data=await r.json();
    PRODS.length=0;PRODS.push(...data.map(normalizeProduct));
    renderFilters();render();
    try{localStorage.setItem(OZK_CACHE_KEY,JSON.stringify({data,ts:Date.now()}));}catch(e){}
  }catch(e){
    if(!usedCache){
      if(grid)grid.innerHTML='<div class="empty"><p style="color:var(--red)">데이터 불러오기 실패</p><p style="font-size:11px;margin-top:8px">'+e.message+'</p></div>';
      if(ttl)ttl.textContent='오류';
    }
    console.error('Load error:',e);
  }
}
